<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booking Request | Source Stays</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
<div class="wrap nav">
<a class="logo" href="index.html">SOURCE STAYS<span>HOSPITALITY • REAL ESTATE</span></a>
<a class="btn dark" href="index.html">Back</a>
</div>
</header>

<main class="section">
<div class="wrap" style="max-width:700px">

<div class="eyebrow">Booking request</div>
<h2>Tell us what you need</h2>

<form id="form" class="service">

<input name="name" required placeholder="Full name" style="width:100%;padding:13px;margin:6px 0">

<input name="phone" required placeholder="Phone / WhatsApp" style="width:100%;padding:13px;margin:6px 0">

<input name="email" type="email" placeholder="Email" style="width:100%;padding:13px;margin:6px 0">

<label for="check_in" style="display:block;font-weight:700;margin:10px 0 4px">Check-in</label>
<input id="check_in" name="check_in" type="date" required style="width:100%;padding:13px;margin:0 0 8px">

<label for="check_out" style="display:block;font-weight:700;margin:10px 0 4px">Check-out</label>
<input id="check_out" name="check_out" type="date" required style="width:100%;padding:13px;margin:0 0 8px">

<input name="guests" type="number" min="1" value="1" placeholder="Guests" style="width:100%;padding:13px;margin:6px 0">

<textarea name="message" placeholder="Special request" style="width:100%;padding:13px;margin:6px 0;min-height:120px"></textarea>

<button class="btn dark">Submit booking request</button>

</form>

<p id="msg"></p>

</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>

<script>
const id = Number(new URLSearchParams(location.search).get('id')) || null;

const checkIn = document.getElementById('check_in');
const checkOut = document.getElementById('check_out');
const today = new Date().toISOString().split('T')[0];

checkIn.min = today;
checkOut.min = today;

checkIn.addEventListener('change', () => {
checkOut.min = checkIn.value || today;
});

document.getElementById('form').onsubmit = async e => {
e.preventDefault();

const b = Object.fromEntries(new FormData(e.target));

b.property_id = id ? Number(id) : null;
b.customer_name = b.name;
b.customer_phone = b.phone;
b.customer_email = b.email || null;

delete b.name;
delete b.phone;
delete b.email;

try {
await SourceStays.submitBooking(b);

document.getElementById('msg').textContent =
'Request received. Source Stays will contact you shortly.';

e.target.reset();

} catch (err) {

console.error(err);

document.getElementById('msg').textContent =
'Something went wrong. Please try again or use WhatsApp.';

}
};
</script>

</body>
</html>
