<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Admin Password | Source Stays</title>
<link rel="stylesheet" href="styles.css">
<style>
.reset-wrap{width:min(480px,92%);margin:9vh auto}.reset-card{background:#fff;border:1px solid #e5e2d9;border-radius:16px;padding:26px;box-shadow:0 8px 30px rgba(0,0,0,.06)}.reset-card h1{font-size:27px;margin:12px 0}.reset-card p{line-height:1.55;color:#555}.reset-field{display:grid;gap:7px;margin:16px 0}.reset-field label{font-weight:700}.reset-field input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font:inherit}.reset-status{margin-top:15px;font-weight:600;overflow-wrap:anywhere}.reset-status.error{color:#a33}.reset-status.success{color:#126b4f}.reset-logo{width:90px;display:block}.reset-logo img{width:100%;height:auto}
</style>
</head>
<body>
<main class="reset-wrap">
<section class="reset-card">
<a class="reset-logo" href="index.html"><img src="source-stays-logo-green-gold.png" alt="Source Stays"></a>
<div class="eyebrow" style="margin-top:16px">Account security</div>
<h1>Set a new admin password</h1>
<p>Use this secure page to update your Source Stays admin password. Your Google Authenticator setup is not changed by this process.</p>
<form id="resetForm" class="hidden">
  <div class="reset-field"><label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="At least 10 characters"></div>
  <div class="reset-field"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required placeholder="Enter the new password again"></div>
  <button id="saveButton" class="btn dark" type="submit">Update password</button>
</form>
<p id="resetStatus" class="reset-status" role="status" aria-live="polite">Checking your secure recovery link...</p>
<p><a href="admin.html">Return to admin sign in</a></p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
'use strict';
const form=document.getElementById('resetForm');
const statusEl=document.getElementById('resetStatus');
const button=document.getElementById('saveButton');
let client;
let recoveryReady=false;
function status(message,type){statusEl.textContent=message;statusEl.className='reset-status '+(type||'');}
function getClient(){
  if(client)return client;
  if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_PUBLISHABLE_KEY)throw new Error('The password recovery service could not be loaded. Refresh and try again.');
  client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return client;
}
function showForm(){recoveryReady=true;form.classList.remove('hidden');status('Recovery link verified. Enter your new password.','success');}
async function initialize(){
  try{
    const sb=getClient();
    sb.auth.onAuthStateChange((event,session)=>{
      if(event==='PASSWORD_RECOVERY'&&session)showForm();
    });
    // Only expose the password form after Supabase explicitly identifies a recovery flow.
    // A pre-existing signed-in session alone must not authorize this recovery page.
    status('Waiting for Supabase to verify your password recovery link...');
    window.setTimeout(()=>{
      if(!recoveryReady)status('This recovery link is invalid, expired, or has already been used. Return to admin sign in and request a new password reset.','error');
    },8000);
  }catch(err){
    console.error('Password recovery initialization failed:',err);
    status(err.message||'Could not validate this recovery link. Please request a new one.','error');
  }
}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  if(!recoveryReady){status('Your recovery link has not been verified. Request a new one from admin sign in.','error');return;}
  const password=document.getElementById('newPassword').value;
  const confirmation=document.getElementById('confirmPassword').value;
  if(password.length<10){status('Use a password with at least 10 characters.','error');return;}
  if(password!==confirmation){status('The passwords do not match.','error');return;}
  button.disabled=true;button.textContent='Updating password...';
  try{
    const {data,error}=await getClient().auth.updateUser({password});
    if(error)throw error;
    if(!data.user)throw new Error('Password update could not be confirmed.');
    form.reset();form.classList.add('hidden');recoveryReady=false;
    status('Your password has been updated successfully. You can now sign in with your new password and Google Authenticator.','success');
  }catch(err){
    console.error('Password update failed:',err);
    status(err.message||'Password update failed. Request a new recovery link and try again.','error');
  }finally{button.disabled=false;button.textContent='Update password';}
});
initialize();
})();
</script>
</body>
</html>
