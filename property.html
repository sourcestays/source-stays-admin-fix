<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | Source Stays</title><link rel="stylesheet" href="styles.css">
  
<style>
  #detail {
    max-width: 1240px;
    margin: 0 auto;
  }

  #detail .split {
    display: grid !important;
    grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.85fr) !important;
    align-items: start;
    gap: 28px !important;
  }

  #detail .split > div {
    min-width: 0;
  }

  #mainPropertyImage {
    height: 440px !important;
    border-radius: 16px !important;
    background: #f1f0ec !important;
    box-shadow: 0 8px 26px rgba(0,0,0,.07);
  }

  #mainPropertyImage > img {
    width: 100% !important;
    height: 100% !important;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .property-thumbnails {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    width: 100%;
    max-width: 100%;
    flex-wrap: nowrap;
    padding: 2px 2px 12px;
    scrollbar-width: thin;
    scrollbar-color: #b9c5bf #f1f3f1;
  }

  .property-thumbnails img {
    width: 88px !important;
    height: 68px !important;
    flex: 0 0 88px;
    object-fit: cover;
    border-radius: 9px !important;
    transition: transform .2s ease;
  }

  .property-thumbnails img:hover {
    transform: translateY(-2px);
  }

  .property-info {
    padding: 26px;
    border: 1px solid #e8ebe8;
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 8px 26px rgba(0,0,0,.045);
  }

  .property-info h2 {
    font-size: clamp(26px, 3vw, 36px);
    line-height: 1.15;
    margin: 10px 0 14px;
  }

  .property-info h3 {
    font-size: 24px;
    margin: 20px 0;
  }

  .property-info .btn {
    display: block;
    text-align: center;
    margin-top: 24px;
    padding: 14px 18px;
    border-radius: 9px;
  }

  @media (max-width: 760px) {
    #detail .split {
      grid-template-columns: minmax(0, 1fr) !important;
      gap: 22px !important;
    }

    #mainPropertyImage {
      height: min(72vw, 380px) !important;
      min-height: 250px;
    }

    .property-info {
      padding: 20px;
    }

    .property-thumbnails img {
      width: 76px !important;
      height: 60px !important;
      flex-basis: 76px;
    }
  }
</style>

</head><body><header><div class="wrap nav"><a class="logo" href="index.html">SOURCE STAYS<span>HOSPITALITY • REAL ESTATE</span></a><a class="btn dark" href="index.html">Back</a></div></header><main class="section"><div class="wrap" id="detail">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script>
<script>
const id=Number(new URLSearchParams(location.search).get('id'));

async function show(){
  try{
    const p=await SourceStays.getProperty(id);

   const galleryImages = await SourceStays.getPropertyImages(id);

    const images = galleryImages?.length
      ? galleryImages.map(x => x.image_url)
      : [p.image_url].filter(Boolean);
const mainImage = images[0] || '';
window.galleryImages = images;
window.currentImageIndex = 0;
document.getElementById('detail').innerHTML = `
  <div class="split">

    <div>

      <div
        style="
          position:relative;
          width:100%;
        "
      >
<div
    id="mainPropertyImage"
    style="
        position:relative;
        width:100%;
        height:420px;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f7f7f7;
        border-radius:12px;
        overflow:hidden;
        cursor:pointer;
    "
    onclick="if(event.target===this) openGallery(window.currentImageIndex||0)"
>
    <div style="
        position:absolute;
        inset:0;
        background-image:url('${SourceStays.esc(mainImage)}');
        background-size:cover;
        background-position:center;
        filter:blur(20px);
        transform:scale(1.08);
        opacity:.35;
    "></div>

    <img
        src="${SourceStays.esc(mainImage)}"
        alt="Property image"
        style="
            position:relative;
            z-index:1;
            display:block;
           width:auto;
max-width:100%;
height:auto;
max-height:420px;
object-fit:contain;
        "
    >
</div>

    

        ${images.length > 1 ? `
          <button
            onclick="event.stopPropagation(); previousImage();"
            style="
              position:absolute;
              left:15px;
              top:50%;
              transform:translateY(-50%);
              width:42px;
              height:42px;
              border:0;
              border-radius:50%;
              background:rgba(0,0,0,.55);
              color:white;
              font-size:24px;
              cursor:pointer;
            "
          >‹</button>

          <button
            onclick="event.stopPropagation(); nextImage();"
            style="
              position:absolute;
              right:15px;
              top:50%;
              transform:translateY(-50%);
              width:42px;
              height:42px;
              border:0;
              border-radius:50%;
              background:rgba(0,0,0,.55);
              color:white;
              font-size:24px;
              cursor:pointer;
            "
          >›</button>
        ` : ''}

      </div>

  
<div class="property-thumbnails">

        ${images.map((img,index)=>`
          <img
            src="${SourceStays.esc(img)}"
            onclick="changeMainImage(${index})"
            style="
              width:90px;
              height:70px;
              object-fit:cover;
              border-radius:8px;
              cursor:pointer;
              flex-shrink:0;
              border:2px solid ${index===0 ? '#123f32' : 'transparent'};
            "
          >
        `).join('')}
      </div>

    </div>

    
<div class="property-info">
<div class="eyebrow">
        ${SourceStays.esc(p.category||'shortlet')}
      </div>

      <h2>${SourceStays.esc(p.title)}</h2>

      <p class="muted">
        ${SourceStays.esc(p.location||'Lagos')}
        • ${p.bedrooms||0} bedroom(s)
        • ${p.guests||0} guests
      </p>

      <h3 style="color:#123f32">
        ₦${SourceStays.money(p.price)}
        / ${SourceStays.esc(p.price_period||'per night')}
      </h3>

      <p>${SourceStays.esc(p.description||'')}</p>

      <p>
        <b>Amenities:</b>
        ${SourceStays.esc(p.amenities||'—')}
      </p>

      <a class="btn dark" href="booking.html?id=${p.id}">
        Request booking
      </a>

    </div>

  </div>

  <div
    id="galleryModal"
    style="
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(0,0,0,.95);
      align-items:center;
      justify-content:center;
      padding:20px;
    "
    onclick="closeGallery()"
  >

    <button
      onclick="event.stopPropagation(); closeGallery();"
      style="
        position:absolute;
        top:20px;
        right:25px;
        width:45px;
        height:45px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:28px;
        cursor:pointer;
      "
    >×</button>

    <button
      onclick="event.stopPropagation(); previousImage();"
      style="
        position:absolute;
        left:20px;
        top:50%;
        width:50px;
        height:50px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:32px;
        cursor:pointer;
      "
    >‹</button>

    <img
      id="galleryModalImage"
      src=""
      onclick="event.stopPropagation()"
      style="
        max-width:90vw;
        max-height:85vh;
        object-fit:contain;
        border-radius:8px;
      "
    >

    <button
      onclick="event.stopPropagation(); nextImage();"
      style="
        position:absolute;
        right:20px;
        top:50%;
        width:50px;
        height:50px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:32px;
        cursor:pointer;
      "
    >›</button>

  </div>
`;
    
  }catch(e){
    console.error(e);
    document.getElementById('detail').textContent='Property not found.';
  }
}

function changeMainImage(index){
  const images = window.galleryImages || [];
  if(!images.length)return;

  window.currentImageIndex =
    (Number(index) + images.length) % images.length;

  const url = images[window.currentImageIndex];

  const main = document.getElementById('mainPropertyImage');
  const modalImage = document.getElementById('galleryModalImage');

 if(main){
    const mainImg = main.querySelector('img');
    if(mainImg){
        mainImg.src = url;
    }
}

  if(modalImage){
    modalImage.src = url;
  }

  const thumbnails =
    document.querySelectorAll('#detail img');

  thumbnails.forEach((img,i)=>{
    img.style.border =
      i === window.currentImageIndex
        ? '2px solid #123f32'
        : '2px solid transparent';
  });
}

function previousImage(){
  changeMainImage(
    (window.currentImageIndex || 0) - 1
  );
}

function nextImage(){
  changeMainImage(
    (window.currentImageIndex || 0) + 1
  );
}

function openGallery(index){
  changeMainImage(index);

  const modal = document.getElementById('galleryModal');

  if(modal){
    modal.style.display = 'flex';
  }
}

function closeGallery(){
  const modal = document.getElementById('galleryModal');

  if(modal){
    modal.style.display = 'none';
  }
}

show();
</script>
</body></html>
