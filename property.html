<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | Source Stays</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">SOURCE STAYS<span>HOSPITALITY • REAL ESTATE</span></a><a class="btn dark" href="index.html">Back</a></div></header><main class="section"><div class="wrap" id="detail">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script>
<script>
const id=Number(new URLSearchParams(location.search).get('id'));

async function show(){
  try{
    const p=await SourceStays.getProperty(id);

   const galleryImages = await SourceStays.getPropertyImages(id);

    const images = galleryImages?.length
      ? galleryImages.map(x => x.image_url)
      : [p.image_url].filter(Boolean);
const mainImage = images[0] || '';
window.galleryImages = images;
window.currentImageIndex = 0;
document.getElementById('detail').innerHTML = `
  <div class="split">

    <div>

      <div
        style="
          position:relative;
          width:100%;
        "
      >

       <div
    id="mainPropertyImage"
    style="
        position:relative;
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f7f7f7;
        border-radius:12px;
        overflow:hidden;
        cursor:pointer;
    "
    onclick="openGallery(0)"
>
    <img
        src="${SourceStays.esc(mainImage)}"
        alt="Property image"
        style="
            display:block;
            width:auto;
            max-width:100%;
            height:auto;
            max-height:420px;
            object-fit:contain;
        "
    >
</div>

        ${images.length > 1 ? `
          <button
            onclick="event.stopPropagation(); previousImage();"
            style="
              position:absolute;
              left:15px;
              top:50%;
              transform:translateY(-50%);
              width:42px;
              height:42px;
              border:0;
              border-radius:50%;
              background:rgba(0,0,0,.55);
              color:white;
              font-size:24px;
              cursor:pointer;
            "
          >‹</button>

          <button
            onclick="event.stopPropagation(); nextImage();"
            style="
              position:absolute;
              right:15px;
              top:50%;
              transform:translateY(-50%);
              width:42px;
              height:42px;
              border:0;
              border-radius:50%;
              background:rgba(0,0,0,.55);
              color:white;
              font-size:24px;
              cursor:pointer;
            "
          >›</button>
        ` : ''}

      </div>

      <div
        style="
          display:flex;
          gap:10px;
          margin-top:12px;
          overflow-x:auto;
          padding-bottom:8px;
        "
      >
        ${images.map((img,index)=>`
          <img
            src="${SourceStays.esc(img)}"
            onclick="changeMainImage(${index})"
            style="
              width:90px;
              height:70px;
              object-fit:cover;
              border-radius:8px;
              cursor:pointer;
              flex-shrink:0;
              border:2px solid ${index===0 ? '#123f32' : 'transparent'};
            "
          >
        `).join('')}
      </div>

    </div>

    <div>

      <div class="eyebrow">
        ${SourceStays.esc(p.category||'shortlet')}
      </div>

      <h2>${SourceStays.esc(p.title)}</h2>

      <p class="muted">
        ${SourceStays.esc(p.location||'Lagos')}
        • ${p.bedrooms||0} bedroom(s)
        • ${p.guests||0} guests
      </p>

      <h3 style="color:#123f32">
        ₦${SourceStays.money(p.price)}
        / ${SourceStays.esc(p.price_period||'per night')}
      </h3>

      <p>${SourceStays.esc(p.description||'')}</p>

      <p>
        <b>Amenities:</b>
        ${SourceStays.esc(p.amenities||'—')}
      </p>

      <a class="btn dark" href="booking.html?id=${p.id}">
        Request booking
      </a>

    </div>

  </div>

  <div
    id="galleryModal"
    style="
      display:none;
      position:fixed;
      inset:0;
      z-index:9999;
      background:rgba(0,0,0,.95);
      align-items:center;
      justify-content:center;
      padding:20px;
    "
    onclick="closeGallery()"
  >

    <button
      onclick="event.stopPropagation(); closeGallery();"
      style="
        position:absolute;
        top:20px;
        right:25px;
        width:45px;
        height:45px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:28px;
        cursor:pointer;
      "
    >×</button>

    <button
      onclick="event.stopPropagation(); previousImage();"
      style="
        position:absolute;
        left:20px;
        top:50%;
        width:50px;
        height:50px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:32px;
        cursor:pointer;
      "
    >‹</button>

    <img
      id="galleryModalImage"
      src=""
      onclick="event.stopPropagation()"
      style="
        max-width:90vw;
        max-height:85vh;
        object-fit:contain;
        border-radius:8px;
      "
    >

    <button
      onclick="event.stopPropagation(); nextImage();"
      style="
        position:absolute;
        right:20px;
        top:50%;
        width:50px;
        height:50px;
        border:0;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        color:white;
        font-size:32px;
        cursor:pointer;
      "
    >›</button>

  </div>
`;
    
  }catch(e){
    console.error(e);
    document.getElementById('detail').textContent='Property not found.';
  }
}

function changeMainImage(index){
  const images = window.galleryImages || [];
  if(!images.length)return;

  window.currentImageIndex =
    (Number(index) + images.length) % images.length;

  const url = images[window.currentImageIndex];

  const main = document.getElementById('mainPropertyImage');
  const modalImage = document.getElementById('galleryModalImage');

  if(main){
    main.style.backgroundImage = `url('${url}')`;
  }

  if(modalImage){
    modalImage.src = url;
  }

  const thumbnails =
    document.querySelectorAll('#detail img');

  thumbnails.forEach((img,i)=>{
    img.style.border =
      i === window.currentImageIndex
        ? '2px solid #123f32'
        : '2px solid transparent';
  });
}

function previousImage(){
  changeMainImage(
    (window.currentImageIndex || 0) - 1
  );
}

function nextImage(){
  changeMainImage(
    (window.currentImageIndex || 0) + 1
  );
}

function openGallery(index){
  changeMainImage(index);

  const modal = document.getElementById('galleryModal');

  if(modal){
    modal.style.display = 'flex';
  }
}

function closeGallery(){
  const modal = document.getElementById('galleryModal');

  if(modal){
    modal.style.display = 'none';
  }
}

show();
</script>
</body></html>
