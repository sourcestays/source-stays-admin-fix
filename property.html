
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property | Source Stays</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    :root {
      --ss-green: #123f32;
      --ss-green-deep: #0b2d24;
      --ss-gold: #c5a35b;
      --ss-ink: #202822;
      --ss-muted: #68736c;
      --ss-line: #e7ebe7;
      --ss-paper: #f7f8f5;
    }

    body { background: var(--ss-paper); color: var(--ss-ink); }
    header { background: rgba(255,255,255,.96); border-bottom: 1px solid var(--ss-line); }
    header .nav { min-height: 88px; }
    /* Use only the current green-and-gold logo image; suppress any inherited artwork. */
    header .logo {
      display: inline-flex; align-items: center; justify-content: flex-start;
      width: 190px; height: 72px; padding: 0; margin: 0;
      background: transparent !important; background-image: none !important;
      box-shadow: none !important; border: 0; text-decoration: none;
      flex: 0 0 auto; overflow: visible;
    }
    header .logo::before, header .logo::after { content: none !important; display: none !important; }
    header .logo img {
      display: block; width: 100%; height: 100%; max-width: 190px; max-height: 72px;
      object-fit: contain; object-position: left center; padding: 0; margin: 0;
      background: transparent !important; background-image: none !important;
      border: 0; box-shadow: none; filter: none;
    }
    header .btn { border-radius: 999px; padding: 11px 20px; }
    .section { padding-top: 36px; padding-bottom: 64px; }

    #detail { max-width: 1280px; margin: 0 auto; }
    #detail .property-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }
    #detail .property-layout > * { min-width: 0; }
    .property-gallery { min-width: 0; }

    .main-gallery {
      position: relative; isolation: isolate; display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px;
      width: 100%; height: clamp(320px, 34vw, 440px);
      overflow: hidden; border: 1px solid rgba(18,63,50,.06); border-radius: 18px;
      background: #eeefea; box-shadow: 0 12px 30px rgba(23,42,32,.075);
    }
    .main-gallery .image-backdrop { display: none !important; }
    .main-gallery .main-photo {
      position: relative; z-index: 1; display: block; grid-column: 1; grid-row: 1 / span 2;
      width: 100%; height: 100%; min-width: 0; min-height: 0;
      object-fit: contain; object-position: center; pointer-events: none; background: #eeefea;
    }
    .gallery-side-tile {
      position: relative; display: block; width: 100%; height: 100%; min-width: 0; min-height: 0;
      padding: 0; overflow: hidden; border: 0; border-radius: 0; background: #e5e8e2; cursor: pointer;
    }
    .gallery-side-tile img {
      display: block; width: 100%; height: 100%;
      object-fit: contain; object-position: center; background: #eeefea;
      transition: filter .2s ease;
    }
    .gallery-side-tile:hover img { filter: brightness(.98); }
    .gallery-side-tile[hidden] { display: none !important; }
    .main-gallery.has-one { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .main-gallery.has-one .main-photo { grid-column: 1; grid-row: 1; object-fit: contain; }
    .main-gallery.has-two { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .main-gallery.has-two .main-photo { grid-column: 1; grid-row: 1; }
    .main-gallery.has-two #sidePhotoButton2 { display: none; }
    .main-gallery.has-many #sidePhotoButton1 { grid-column: 2; grid-row: 1; }
    .main-gallery.has-many #sidePhotoButton2 { grid-column: 2; grid-row: 2; }

    .gallery-arrow {
      position: absolute; top: 50%; z-index: 10; display: flex; align-items: center; justify-content: center;
      width: 46px; height: 46px; padding: 0; border: 1px solid rgba(255,255,255,.35); border-radius: 50%;
      background: rgba(18,29,24,.72); color: #fff; font-size: 30px; line-height: 1; cursor: pointer;
      transform: translateY(-50%); pointer-events: auto; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent; box-shadow: 0 4px 14px rgba(0,0,0,.16);
      transition: background .18s ease, transform .18s ease;
    }
    .gallery-arrow:hover { background: var(--ss-green); transform: translateY(-50%) scale(1.05); }
    .gallery-arrow:focus-visible { outline: 3px solid var(--ss-gold); outline-offset: 3px; }
    .gallery-arrow.previous { left: 14px; }
    .gallery-arrow.next { left: auto; right: 14px; }
    .main-gallery .gallery-arrow.previous { left: 14px; }
    .main-gallery .gallery-arrow.next { left: auto; right: 14px; }
    .gallery-count {
      position: absolute; z-index: 5; right: 14px; bottom: 14px; padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(18,29,24,.72);
      color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .04em; pointer-events: none;
    }

    .property-thumbnails {
      display: flex; gap: 11px; width: 100%; max-width: 100%; margin-top: 15px; padding: 3px 2px 12px;
      overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap; scrollbar-width: thin;
      scrollbar-color: #b9c5bf #edf0ec; scroll-snap-type: x proximity;
    }
    .property-thumbnails button {
      flex: 0 0 92px; width: 92px; height: 72px; padding: 0; overflow: hidden;
      border: 2px solid transparent; border-radius: 11px; background: #e9ece7; cursor: pointer;
      scroll-snap-align: start; transition: border-color .18s ease, transform .18s ease;
    }
    .property-thumbnails button:hover { transform: translateY(-2px); }
    .property-thumbnails button[aria-current="true"] { border-color: var(--ss-green); box-shadow: 0 0 0 2px rgba(18,63,50,.12); }
    .property-thumbnails img { display: block; width: 100%; height: 100%; object-fit: contain; background: #eeefea; pointer-events: none; }

    .property-info {
      position: sticky; top: 22px; padding: clamp(22px, 2.5vw, 32px); border: 1px solid var(--ss-line);
      border-radius: 20px; background: #fff; box-shadow: 0 14px 38px rgba(23,42,32,.055); overflow-wrap: anywhere;
    }
    .property-info .eyebrow { color: #9b7b37; font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    .property-info h2 { margin: 12px 0 14px; color: var(--ss-ink); font-size: clamp(28px, 3vw, 40px); line-height: 1.12; letter-spacing: -.035em; }
    .property-info .muted { color: var(--ss-muted); font-size: 14px; line-height: 1.7; }
    .property-info h3 { margin: 24px 0 18px; color: var(--ss-green); font-size: clamp(23px, 2.2vw, 29px); line-height: 1.3; }
    .property-info p { line-height: 1.75; }
    .property-info p b { color: var(--ss-ink); }
    .property-info .btn { display: block; margin-top: 26px; padding: 15px 18px; border-radius: 10px; text-align: center; font-weight: 700; box-shadow: 0 7px 18px rgba(18,63,50,.12); }
    .property-info .btn:hover { background: var(--ss-green-deep); }

/* Property booking and inspection actions */
.property-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}

.property-actions > .btn {
  width: 100%;
  min-height: 54px;
  margin: 0 !important;
  display: flex !important;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.35;
}

.property-actions .inspection-trigger {
  background: #fff;
  color: var(--ss-green);
  border: 1.5px solid var(--ss-green);
  box-shadow: none;
}

.property-actions .inspection-trigger:hover {
  background: #f1f6f2;
  color: var(--ss-green-deep);
}

/* Inspection form panel */
#inspectionRequestPanel {
  margin-top: 18px;
  padding: clamp(18px, 2.5vw, 26px);
  border: 1px solid var(--ss-line);
  border-radius: 16px;
  background: #f9faf7;
}

#inspectionRequestPanel[hidden] {
  display: none !important;
}

#inspectionRequestPanel h3 {
  margin: 0 0 8px;
}

#inspectionRequestPanel .inspection-intro {
  margin: 0 0 20px;
  color: var(--ss-muted);
  font-size: 14px;
  line-height: 1.7;
}

/* Responsive inspection form */
#customerInspectionForm {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

#customerInspectionForm .inspection-field {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}

#customerInspectionForm .inspection-field.full-width {
  grid-column: 1 / -1;
}

#customerInspectionForm label {
  display: block;
  color: var(--ss-ink);
  font-size: 13px;
  font-weight: 700;
}

#customerInspectionForm input,
#customerInspectionForm select,
#customerInspectionForm textarea {
  display: block;
  width: 100%;
  min-width: 0;
  max-width: 100%;
  min-height: 48px;
  padding: 12px 13px;
  border: 1px solid #d9e0da;
  border-radius: 9px;
  background: #fff;
  color: var(--ss-ink);
  font: inherit;
  font-size: 14px;
  box-sizing: border-box;
}

#customerInspectionForm textarea {
  min-height: 105px;
  resize: vertical;
  line-height: 1.6;
}

#customerInspectionForm .inspection-submit {
  grid-column: 1 / -1;
  width: 100%;
  min-height: 50px;
  margin: 2px 0 0;
}

#inspectionRequestMessage {
  grid-column: 1 / -1;
  margin: 0;
  line-height: 1.6;
}

/* Mobile layout */
@media (max-width: 760px) {
  .property-actions {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  #customerInspectionForm {
    grid-template-columns: 1fr;
    gap: 14px;
  }

  #customerInspectionForm .inspection-field.full-width,
  #customerInspectionForm .inspection-submit,
  #inspectionRequestMessage {
    grid-column: 1;
  }
}

    .gallery-modal {
      position: fixed; inset: 0; z-index: 99999; display: none; align-items: center; justify-content: center;
      padding: 24px; background: rgba(8,15,12,.96); backdrop-filter: blur(5px);
    }
    .gallery-modal.is-open { display: flex; }
    .gallery-modal img { display: block; max-width: 90vw; max-height: 85vh; object-fit: contain; border-radius: 8px; box-shadow: 0 12px 50px rgba(0,0,0,.3); }
    .gallery-modal .modal-close {
      position: absolute; top: 18px; right: 20px; z-index: 2; width: 46px; height: 46px; border: 0;
      border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 30px; cursor: pointer;
    }
    .gallery-modal .modal-arrow {
      position: absolute; top: 50%; z-index: 2; width: 48px; height: 48px; border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; font-size: 32px; cursor: pointer; transform: translateY(-50%);
    }
    .gallery-modal .modal-previous { left: 18px; }
    .gallery-modal .modal-next { right: 18px; }
    .gallery-modal button:hover { background: var(--ss-green); }
    .gallery-modal button:focus-visible { outline: 3px solid var(--ss-gold); outline-offset: 3px; }
    .gallery-modal .modal-count { position: absolute; bottom: 16px; left: 50%; padding: 7px 12px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; transform: translateX(-50%); }

    @media (max-width: 900px) {
      #detail .property-layout { grid-template-columns: minmax(0, 1fr) minmax(260px, .85fr); gap: 20px; }
      .main-gallery { height: clamp(300px, 38vw, 380px); }
      .property-info { padding: 22px; }
    }
    @media (max-width: 760px) {
      header .nav { min-height: 72px; }
      header .logo { width: 150px; height: 58px; }
      header .logo img { max-width: 150px; max-height: 58px; }
      .section { padding-top: 22px; padding-bottom: 42px; }
      #detail .property-layout { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .main-gallery { height: auto; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 62vw) 100px; gap: 5px; border-radius: 14px; }
      .main-gallery .main-photo { grid-column: 1 / span 2; grid-row: 1; object-fit: contain; }
      .main-gallery.has-one { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 62vw); }
      .main-gallery.has-one .main-photo { grid-column: 1; grid-row: 1; }
      .main-gallery.has-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 62vw) 90px; }
      .main-gallery.has-two .main-photo { grid-column: 1 / span 2; grid-row: 1; }
      .main-gallery.has-two #sidePhotoButton1 { grid-column: 1; grid-row: 2; }
      .main-gallery.has-two #sidePhotoButton2 { display: none; }
      .main-gallery.has-many #sidePhotoButton1 { grid-column: 1; grid-row: 2; }
      .main-gallery.has-many #sidePhotoButton2 { grid-column: 2; grid-row: 2; }
      .gallery-arrow { width: 40px; height: 40px; font-size: 26px; }
      .gallery-arrow.previous { left: 10px; }
      .gallery-arrow.next { right: 10px; }
      .property-info { position: static; padding: 23px; border-radius: 16px; }
      .property-info h2 { font-size: clamp(29px, 8vw, 38px); }
      .property-thumbnails button { flex-basis: 78px; width: 78px; height: 62px; }
      .gallery-modal { padding: 12px; }
      .gallery-modal img { max-width: 94vw; max-height: 78vh; }
      .gallery-modal .modal-previous { left: 8px; }
      .gallery-modal .modal-next { right: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }

      #detail .desktop-video,
      #detail .description-after-video { display: none !important; }
      #detail .property-video.mobile-video { display: block; }
      #detail .property-info .description-in-info { display: block; }

<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html" aria-label="Source Stays home">
        <img src="source-stays-logo-green-gold.png" alt="Source Stays">
      </a>
      <a class="btn dark" href="index.html">Back</a>
    </div>
  </header>

  <main class="section">
    <div class="wrap" id="detail">Loading property...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>

  <script>
    const propertyId = Number(
      new URLSearchParams(location.search).get("id")
    );

    let galleryImages = [];
    let currentImageIndex = 0;
    let galleryReady = false;

    const detail = document.getElementById("detail");

    function safeImageUrl(url) {
      if (typeof url !== "string") return "";
      return url;
    }

    function changeMainImage(index) {
      if (!galleryImages.length) return;

      currentImageIndex =
        (Number(index) + galleryImages.length) % galleryImages.length;

      const url = safeImageUrl(galleryImages[currentImageIndex]);
      const mainImage = document.getElementById("mainPhoto");
      const backdrop = document.getElementById("imageBackdrop");
      const modalImage = document.getElementById("modalPhoto");

      if (mainImage) {
        mainImage.src = url;
      }
      if (backdrop) backdrop.style.backgroundImage = `url("${url}")`;
      if (modalImage) modalImage.src = url;

      const gallery = document.getElementById("mainGallery");
      const sideButton1 = document.getElementById("sidePhotoButton1");
      const sideButton2 = document.getElementById("sidePhotoButton2");
      const sideImage1 = document.getElementById("sidePhoto1");
      const sideImage2 = document.getElementById("sidePhoto2");
      if (gallery) {
        gallery.classList.toggle("has-one", galleryImages.length <= 1);
        gallery.classList.toggle("has-two", galleryImages.length === 2);
        gallery.classList.toggle("has-many", galleryImages.length >= 3);
      }
      const sideIndex1 = (currentImageIndex + 1) % galleryImages.length;
      const sideIndex2 = (currentImageIndex + 2) % galleryImages.length;
      if (sideButton1) sideButton1.hidden = galleryImages.length < 2;
      if (sideButton2) sideButton2.hidden = galleryImages.length < 3;
      if (sideImage1 && galleryImages.length > 1) {
        sideImage1.src = safeImageUrl(galleryImages[sideIndex1]);
        sideImage1.alt = `${document.getElementById("mainPhoto")?.alt || "Property"} photo ${sideIndex1 + 1}`;
      }
      if (sideImage2 && galleryImages.length > 2) {
        sideImage2.src = safeImageUrl(galleryImages[sideIndex2]);
        sideImage2.alt = `${document.getElementById("mainPhoto")?.alt || "Property"} photo ${sideIndex2 + 1}`;
      }

      document.querySelectorAll(".property-thumbnails button")
        .forEach((button, index) => {
          const active = index === currentImageIndex;
          button.setAttribute("aria-current", String(active));
        });

      updateGalleryCounts();
    }

    function updateGalleryCounts() {
      const text = galleryImages.length
        ? `${currentImageIndex + 1} / ${galleryImages.length}`
        : "";

      const mainCount = document.getElementById("mainGalleryCount");
      const modalCount = document.getElementById("modalGalleryCount");

      if (mainCount) mainCount.textContent = text;
      if (modalCount) modalCount.textContent = text;
    }

    function previousImage() {
      changeMainImage(currentImageIndex - 1);
    }

    function nextImage() {
      changeMainImage(currentImageIndex + 1);
    }

    function openGallery() {
      if (!galleryImages.length) return;

      changeMainImage(currentImageIndex);

      const modal = document.getElementById("galleryModal");
      if (!modal) return;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const closeButton = modal.querySelector(".modal-close");
      if (closeButton) closeButton.focus();
    }

    function closeGallery() {
      const modal = document.getElementById("galleryModal");
      if (!modal) return;

      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function renderProperty(p, hotelRooms = []) {
      const title = SourceStays.esc(p.title || "Property");
      const category = SourceStays.esc(p.category || "shortlet");
      const location = SourceStays.esc(p.location || "Lagos");
      const description = SourceStays.esc(p.description || "");
      const amenities = SourceStays.esc(p.amenities || "—");
      const period = SourceStays.esc(p.price_period || "per night");
const isSaleListing = ["sale", "land"].includes(String(p.category || "").toLowerCase());
const landPrice = Number(p.land_price) || 0;
const basePropertyPrice = landPrice > 0 ? landPrice : (Number(p.price) || 0);
const saleFees = [
  ["Agency fee", Number(p.agency_fee) || 0],
  ["Legal fee", Number(p.legal_fee) || 0],
  ["Agreement fee", Number(p.agreement_fee) || 0],
  ["Service charge", Number(p.service_charge) || 0],
  ["Title search fee", Number(p.title_search_fee) || 0],
  ["Survey fee", Number(p.survey_fee) || 0],
  ["Preliminary development fee", Number(p.preliminary_development_fee) || 0],
  ["Documentation fee", Number(p.documentation_fee) || 0],
  ["Transfer fee", Number(p.transfer_fee) || 0],
  [SourceStays.esc(p.other_fee_label || "Other fee"), Number(p.other_fee) || 0]
].filter((fee) => fee[1] > 0);
const totalAdditionalFees = saleFees.reduce((sum, fee) => sum + fee[1], 0);
const totalPayable = basePropertyPrice + totalAdditionalFees;
const feesDueLater = String(p.fees_due_later || "").trim();
const initialDeposit = Number(p.initial_deposit) || 0;
const sixMonthPayment = Number(p.payment_0_6_months) || 0;
const twelveMonthPayment = Number(p.payment_7_12_months) || 0;

const hasPricingBreakdown = isSaleListing && (basePropertyPrice > 0 || totalAdditionalFees > 0);
const hasPaymentPlan = isSaleListing &&
  (initialDeposit > 0 || sixMonthPayment > 0 || twelveMonthPayment > 0);
      detail.innerHTML = `
        <div class="property-layout">
          <section class="property-gallery" aria-label="Property photos">
            <div class="main-gallery" id="mainGallery">
              <img
                class="main-photo"
                id="mainPhoto"
                src=""
                alt="${title}"
              >

              <button type="button" class="gallery-side-tile" id="sidePhotoButton1" aria-label="View another property photo">
                <img id="sidePhoto1" src="" alt="${title} additional photo">
              </button>
              <button type="button" class="gallery-side-tile" id="sidePhotoButton2" aria-label="View another property photo">
                <img id="sidePhoto2" src="" alt="${title} additional photo">
              </button>

              <button
                type="button"
                class="gallery-arrow previous"
                id="mainPrevious"
                aria-label="Previous property photo"
              >‹</button>

              <button
                type="button"
                class="gallery-arrow next"
                id="mainNext"
                aria-label="Next property photo"
              >›</button>

              <span class="gallery-count" id="mainGalleryCount"></span>
            </div>

            <div
              class="property-thumbnails"
              id="propertyThumbnails"
              aria-label="Choose property photo"
            ></div>

            ${p.video_url ? `
              <section class="property-video desktop-video" style="margin: 26px 0 0; width: 100%; box-sizing: border-box;">
                <h2>Property Video Tour</h2>
                <video controls playsinline preload="metadata" style="width: 100%; height: auto; max-height: 70vh; border-radius: 12px; display: block; margin: 0;" src="${SourceStays.esc(p.video_url)}">
                  Your browser does not support video playback.
                </video>
              </section>
              <section class="description-after-video">
                <h2>Property Description</h2>
                <p>${description}</p>
              </section>
            ` : `
              <section class="description-after-video">
                <h2>Property Description</h2>
                <p>${description}</p>

      });

      const mainGallery = document.getElementById("mainGallery");
      const mainPrevious = document.getElementById("mainPrevious");
      const mainNext = document.getElementById("mainNext");
      const modal = document.getElementById("galleryModal");

      mainPrevious.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        previousImage();
      });

      mainNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        nextImage();
      });

      document.getElementById("sidePhotoButton1").addEventListener("click", (event) => {
        event.stopPropagation();
        changeMainImage(currentImageIndex + 1);
      });
      document.getElementById("sidePhotoButton2").addEventListener("click", (event) => {
        event.stopPropagation();
        changeMainImage(currentImageIndex + 2);
      });

      mainGallery.addEventListener("click", (event) => {
        if (
          event.target === mainGallery ||
          event.target.id === "mainPhoto" ||
          event.target.id === "imageBackdrop"
        ) {
          openGallery();
        }
      });

      modal.querySelector(".modal-close")
        .addEventListener("click", closeGallery);

      modal.querySelector(".modal-previous")
        .addEventListener("click", (event) => {
          event.stopPropagation();
          previousImage();
        });

      modal.querySelector(".modal-next")
        .addEventListener("click", (event) => {
          event.stopPropagation();
          nextImage();
        });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeGallery();
      });

      modal.querySelector("#modalPhoto")
        .addEventListener("click", (event) => {
          event.stopPropagation();
        });

      document.addEventListener("keydown", (event) => {
        if (!modal.classList.contains("is-open")) return;

        if (event.key === "Escape") closeGallery();
        if (event.key === "ArrowLeft") previousImage();
        if (event.key === "ArrowRight") nextImage();
      });

      if (galleryImages.length <= 1) {
        mainPrevious.hidden = true;
        mainNext.hidden = true;
      }

      changeMainImage(0);
      galleryReady = true;
    }

    async function showProperty() {
      try {
        if (!Number.isFinite(propertyId) || propertyId <= 0) {
          throw new Error("Invalid property ID");
        }

        const property = await SourceStays.getProperty(propertyId);

        if (!property) {
          throw new Error("Property not found");
        }

        let propertyImages = [];

        try {
          const result = await SourceStays.getPropertyImages(propertyId);
          if (Array.isArray(result)) {
            propertyImages = result
              .map((item) => item.image_url)
              .filter((url) => typeof url === "string" && url.length > 0);
          }
        } catch (imageError) {
          console.error("Could not load additional property images:", imageError);
        }

        if (!propertyImages.length && property.image_url) {
          propertyImages = [property.image_url];
        }

        galleryImages = propertyImages;
        currentImageIndex = 0;

        if (!galleryImages.length) {
          detail.innerHTML = `
            <p>This property has no photos available yet.</p>
            <a class="btn dark" href="index.html">Back to properties</a>
          `;
          return;
        }

        let hotelRooms = [];
        if (String(property.category || "").toLowerCase() === "hotel") {
          const { data: roomData, error: roomError } = await SourceStays.supabase
            .from("hotel_room_categories_public")
            .select("id, room_name, description, customer_rate, max_guests, photo_urls, video_url, sort_order")
            .eq("property_id", propertyId)
            .order("sort_order", { ascending: true });
          if (roomError) {
            console.error("Could not load hotel room categories:", roomError);
          } else {
            hotelRooms = roomData || [];
          }
        }

        renderProperty(property, hotelRooms);

      } catch (error) {
        console.error("Could not load property:", error);
        detail.innerHTML = `
          <p>We couldn't load this property. Please try again.</p>
          <a class="btn dark" href="index.html">Back to properties</a>
        `;
      }
    }

    showProperty();
  </script>
</body>
</html>
