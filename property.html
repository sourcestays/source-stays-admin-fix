
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Property | Source Stays</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    #detail {
      max-width: 1240px;
      margin: 0 auto;
    }

    #detail .property-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(320px, 1fr);
      gap: 28px;
      align-items: start;
    }

    #detail .property-layout > * {
      min-width: 0;
    }

    .main-gallery {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: 440px;
      overflow: hidden;
      border-radius: 16px;
      background: #f1f0ec;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .07);
    }

    .main-gallery .image-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-position: center;
      background-size: cover;
      filter: blur(18px);
      transform: scale(1.08);
      opacity: .08;
      pointer-events: none;
    }

    .main-gallery .main-photo {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .62);
      color: #fff;
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
      pointer-events: auto;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .gallery-arrow:hover {
      background: #123f32;
    }

    .gallery-arrow:focus-visible {
      outline: 3px solid #d5b56a;
      outline-offset: 3px;
    }

    .gallery-arrow.previous {
      left: 14px;
    }

    .gallery-arrow.next {
      right: 14px;
    }

    .gallery-count {
      position: absolute;
      z-index: 5;
      right: 12px;
      bottom: 12px;
      padding: 6px 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, .65);
      color: #fff;
      font-size: 13px;
      pointer-events: none;
    }

    .property-thumbnails {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 100%;
      margin-top: 14px;
      padding: 2px 2px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      flex-wrap: nowrap;
      scrollbar-width: thin;
      scrollbar-color: #b9c5bf #f1f3f1;
    }

    .property-thumbnails button {
      flex: 0 0 88px;
      width: 88px;
      height: 68px;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 9px;
      background: #f1f0ec;
      cursor: pointer;
    }

    .property-thumbnails button[aria-current="true"] {
      border-color: #123f32;
    }

    .property-thumbnails img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .property-info {
      padding: 26px;
      border: 1px solid #e8ebe8;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .045);
      overflow-wrap: anywhere;
    }

    .property-info h2 {
      margin: 10px 0 14px;
      font-size: clamp(26px, 3vw, 36px);
      line-height: 1.15;
    }

    .property-info h3 {
      margin: 20px 0;
      color: #123f32;
      font-size: 24px;
      line-height: 1.3;
    }

    .property-info .btn {
      display: block;
      margin-top: 24px;
      padding: 14px 18px;
      border-radius: 9px;
      text-align: center;
    }

    .gallery-modal {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, .95);
    }

    .gallery-modal.is-open {
      display: flex;
    }

    .gallery-modal img {
      display: block;
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .gallery-modal .modal-close {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 2;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 30px;
      cursor: pointer;
    }

    .gallery-modal .modal-arrow {
      position: absolute;
      top: 50%;
      z-index: 2;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .gallery-modal .modal-previous {
      left: 18px;
    }

    .gallery-modal .modal-next {
      right: 18px;
    }

    .gallery-modal button:hover {
      background: #123f32;
    }

    .gallery-modal button:focus-visible {
      outline: 3px solid #d5b56a;
      outline-offset: 3px;
    }

    .gallery-modal .modal-count {
      position: absolute;
      bottom: 16px;
      left: 50%;
      padding: 7px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, .6);
      color: #fff;
      transform: translateX(-50%);
    }

    @media (max-width: 760px) {
      #detail .property-layout {
        grid-template-columns: minmax(0, 1fr);
        gap: 22px;
      }

      .main-gallery {
        height: min(72vw, 380px);
        min-height: 250px;
      }

      .gallery-arrow {
        width: 40px;
        height: 40px;
        font-size: 26px;
      }

      .gallery-arrow.previous {
        left: 10px;
      }

      .gallery-arrow.next {
        right: 10px;
      }

      .property-info {
        padding: 20px;
      }

      .property-thumbnails button {
        flex-basis: 76px;
        width: 76px;
        height: 60px;
      }

      .gallery-modal {
        padding: 12px;
      }

      .gallery-modal img {
        max-width: 94vw;
        max-height: 78vh;
      }

      .gallery-modal .modal-previous {
        left: 8px;
      }

      .gallery-modal .modal-next {
        right: 8px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">
        SOURCE STAYS
        <span>HOSPITALITY • REAL ESTATE</span>
      </a>
      <a class="btn dark" href="index.html">Back</a>
    </div>
  </header>

  <main class="section">
    <div class="wrap" id="detail">Loading property...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>

  <script>
    const propertyId = Number(
      new URLSearchParams(location.search).get("id")
    );

    let galleryImages = [];
    let currentImageIndex = 0;
    let galleryReady = false;

    const detail = document.getElementById("detail");

    function safeImageUrl(url) {
      if (typeof url !== "string") return "";
      return url;
    }

    function changeMainImage(index) {
      if (!galleryImages.length) return;

      currentImageIndex =
        (Number(index) + galleryImages.length) % galleryImages.length;

      const url = safeImageUrl(galleryImages[currentImageIndex]);
      const mainImage = document.getElementById("mainPhoto");
      const backdrop = document.getElementById("imageBackdrop");
      const modalImage = document.getElementById("modalPhoto");

      if (mainImage) mainImage.src = url;
      if (backdrop) backdrop.style.backgroundImage = `url("${url}")`;
      if (modalImage) modalImage.src = url;

      document.querySelectorAll(".property-thumbnails button")
        .forEach((button, index) => {
          const active = index === currentImageIndex;
          button.setAttribute("aria-current", String(active));
        });

      updateGalleryCounts();
    }

    function updateGalleryCounts() {
      const text = galleryImages.length
        ? `${currentImageIndex + 1} / ${galleryImages.length}`
        : "";

      const mainCount = document.getElementById("mainGalleryCount");
      const modalCount = document.getElementById("modalGalleryCount");

      if (mainCount) mainCount.textContent = text;
      if (modalCount) modalCount.textContent = text;
    }

    function previousImage() {
      changeMainImage(currentImageIndex - 1);
    }

    function nextImage() {
      changeMainImage(currentImageIndex + 1);
    }

    function openGallery() {
      if (!galleryImages.length) return;

      changeMainImage(currentImageIndex);

      const modal = document.getElementById("galleryModal");
      if (!modal) return;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      const closeButton = modal.querySelector(".modal-close");
      if (closeButton) closeButton.focus();
    }

    function closeGallery() {
      const modal = document.getElementById("galleryModal");
      if (!modal) return;

      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function renderProperty(p) {
      const title = SourceStays.esc(p.title || "Property");
      const category = SourceStays.esc(p.category || "shortlet");
      const location = SourceStays.esc(p.location || "Lagos");
      const description = SourceStays.esc(p.description || "");
      const amenities = SourceStays.esc(p.amenities || "—");
      const period = SourceStays.esc(p.price_period || "per night");

      detail.innerHTML = `
        <div class="property-layout">
          <section class="property-gallery" aria-label="Property photos">
            <div class="main-gallery" id="mainGallery">
              <div class="image-backdrop" id="imageBackdrop"></div>

              <img
                class="main-photo"
                id="mainPhoto"
                src=""
                alt="${title}"
              >

              <button
                type="button"
                class="gallery-arrow previous"
                id="mainPrevious"
                aria-label="Previous property photo"
              >‹</button>

              <button
                type="button"
                class="gallery-arrow next"
                id="mainNext"
                aria-label="Next property photo"
              >›</button>

              <span class="gallery-count" id="mainGalleryCount"></span>
            </div>

            <div
              class="property-thumbnails"
              id="propertyThumbnails"
              aria-label="Choose property photo"
            ></div>
          </section>

          <section class="property-info">
            <div class="eyebrow">${category}</div>

            <h2>${title}</h2>

            <p class="muted">
              ${location}
              • ${p.bedrooms || 0} bedroom(s)
              • ${p.guests || 0} guests
            </p>

            <h3>
              ₦${SourceStays.money(p.price)} / ${period}
            </h3>

            <p>${description}</p>

            <p><b>Amenities:</b> ${amenities}</p>

            <a class="btn dark" href="booking.html?id=${encodeURIComponent(p.id)}">
              Request booking
            </a>
          </section>
        </div>

        <div
          class="gallery-modal"
          id="galleryModal"
          role="dialog"
          aria-label="Property photo gallery"
          aria-modal="true"
          aria-hidden="true"
        >
          <button
            type="button"
            class="modal-close"
            aria-label="Close gallery"
          >×</button>

          <button
            type="button"
            class="modal-arrow modal-previous"
            aria-label="Previous photo"
          >‹</button>

          <img id="modalPhoto" src="" alt="${title}">

          <button
            type="button"
            class="modal-arrow modal-next"
            aria-label="Next photo"
          >›</button>

          <span class="modal-count" id="modalGalleryCount"></span>
        </div>
      `;

      const thumbnailContainer =
        document.getElementById("propertyThumbnails");

      galleryImages.forEach((url, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", `Show photo ${index + 1}`);
        button.setAttribute("aria-current", String(index === 0));

        const image = document.createElement("img");
        image.src = safeImageUrl(url);
        image.alt = `${title} photo ${index + 1}`;
        image.loading = "lazy";

        button.appendChild(image);

        button.addEventListener("click", () => {
          changeMainImage(index);
        });

        thumbnailContainer.appendChild(button);
      });

      const mainGallery = document.getElementById("mainGallery");
      const mainPrevious = document.getElementById("mainPrevious");
      const mainNext = document.getElementById("mainNext");
      const modal = document.getElementById("galleryModal");

      mainPrevious.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        previousImage();
      });

      mainNext.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        nextImage();
      });

      mainGallery.addEventListener("click", (event) => {
        if (
          event.target === mainGallery ||
          event.target.id === "mainPhoto" ||
          event.target.id === "imageBackdrop"
        ) {
          openGallery();
        }
      });

      modal.querySelector(".modal-close")
        .addEventListener("click", closeGallery);

      modal.querySelector(".modal-previous")
        .addEventListener("click", (event) => {
          event.stopPropagation();
          previousImage();
        });

      modal.querySelector(".modal-next")
        .addEventListener("click", (event) => {
          event.stopPropagation();
          nextImage();
        });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeGallery();
      });

      modal.querySelector("#modalPhoto")
        .addEventListener("click", (event) => {
          event.stopPropagation();
        });

      document.addEventListener("keydown", (event) => {
        if (!modal.classList.contains("is-open")) return;

        if (event.key === "Escape") closeGallery();
        if (event.key === "ArrowLeft") previousImage();
        if (event.key === "ArrowRight") nextImage();
      });

      if (galleryImages.length <= 1) {
        mainPrevious.hidden = true;
        mainNext.hidden = true;
      }

      changeMainImage(0);
      galleryReady = true;
    }

    async function showProperty() {
      try {
        if (!Number.isFinite(propertyId) || propertyId <= 0) {
          throw new Error("Invalid property ID");
        }

        const property = await SourceStays.getProperty(propertyId);

        if (!property) {
          throw new Error("Property not found");
        }

        let propertyImages = [];

        try {
          const result = await SourceStays.getPropertyImages(propertyId);
          if (Array.isArray(result)) {
            propertyImages = result
              .map((item) => item.image_url)
              .filter((url) => typeof url === "string" && url.length > 0);
          }
        } catch (imageError) {
          console.error("Could not load additional property images:", imageError);
        }

        if (!propertyImages.length && property.image_url) {
          propertyImages = [property.image_url];
        }

        galleryImages = propertyImages;
        currentImageIndex = 0;

        if (!galleryImages.length) {
          detail.innerHTML = `
            <p>This property has no photos available yet.</p>
            <a class="btn dark" href="index.html">Back to properties</a>
          `;
          return;
        }

        renderProperty(property);

      } catch (error) {
        console.error("Could not load property:", error);
        detail.innerHTML = `
          <p>We couldn't load this property. Please try again.</p>
          <a class="btn dark" href="index.html">Back to properties</a>
        `;
      }
    }

    showProperty();
  </script>
</body>
</html>
