<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property | Source Stays</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="wrap nav"><a class="logo" href="index.html">SOURCE STAYS<span>HOSPITALITY • REAL ESTATE</span></a><a class="btn dark" href="index.html">Back</a></div></header><main class="section"><div class="wrap" id="detail">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="app.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'));
async function show(){try{const p=await SourceStays.getProperty(id);document.getElementById('detail').innerHTML=`<div class="split"><div class="panel" style="background-image:url('${SourceStays.esc(p.image_url||'')}')"></div><div><div class="eyebrow">${SourceStays.esc(p.category||'shortlet')}</div><h2>${SourceStays.esc(p.title)}</h2><p class="muted">${SourceStays.esc(p.location||'Lagos')} • ${p.bedrooms||0} bedroom(s) • ${p.guests||0} guests</p><h3 style="color:#123f32">₦${SourceStays.money(p.price)} / ${SourceStays.esc(p.price_period||'per night')}</h3><p>${SourceStays.esc(p.description||'')}</p><p><b>Amenities:</b> ${SourceStays.esc(p.amenities||'—')}</p><a class="btn dark" href="booking.html?id=${p.id}">Request booking</a></div></div>`}catch(e){document.getElementById('detail').textContent='Property not found.'}}
show();
</script></body></html>
